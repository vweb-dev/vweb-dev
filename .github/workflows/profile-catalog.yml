name: Public Profile Repository Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - scripts/sync_profile_catalog.py
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public-only directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_profile_catalog.py
      - name: Commit refreshed project links
        run: |
          git config user.name "VWEB.DEV README Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update public GitHub directory [skip ci]"
            git push
          fi
