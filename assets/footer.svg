<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="93" viewBox="0 0 1100 93" role="img" aria-label="Animated corporate VWEB.DEV footer"><title>Animated corporate VWEB.DEV footer</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="1100" height="93" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1100" height="93" rx="16" fill="#080c12"/><path d="M19 20H1081" fill="none" stroke="#c9a96e" stroke-width="1.2" class="trace" stroke-opacity=".6"/><text x="24" y="61" font-size="17" font-weight="690" fill="#efdbb6" letter-spacing=".7">BRAND STRATEGY &amp; DESIGN BY VWEB.DEV</text><text x="1073" y="61" font-size="14" font-weight="490" fill="#a4afbd" letter-spacing="1.1" text-anchor="end">DESIGN  /  BUILD  /  GROW</text></g></svg>