<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-label="ASTER current manufacturer facts and Pakistan deployment focus"><title>ASTER current manufacturer facts and Pakistan deployment focus</title><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2a38"/><stop offset="1" stop-color="#101620"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efdbb6"/><stop offset=".5" stop-color="#c9a96e"/><stop offset="1" stop-color="#856c45"/></linearGradient><clipPath id="clip"><rect width="1100" height="305" rx="16"/></clipPath><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
