><text x="52" y="145" font-size="21" fill="#f7f4eb" font-weight="600">VWEB.DEV — independent digital product and creative studio</text><text x="52" y="185" font-size="17" fill="#9ba6b1" font-weight="450">Founded by Zeeshan Ali Raza. Based in Lahore, Pakistan.</text><text x="52" y="224" font-size="17" fill="#9ba6b1" font-weight="450">We design, build, integrate and grow connected digital experiences.</text><text x="52" y="266" font-size="16" fill="#79d2a6" font-weight="500" class="mono">$ focus = practical solutions / elegant experiences / sustainable systems</text></g></svg>