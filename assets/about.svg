<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="309" viewBox="0 0 1100 309" role="img" aria-label="VWEB.DEV terminal-style studio introduction"><title>VWEB.DEV terminal-style studio introduction</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="1100" height="309" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1100" height="309" rx="17" fill="#080c12"/><rect x="1" y="1" width="1098" height="307" rx="17" fill="none" stroke="#4c3f30"/><rect x="21" y="20" width="1058" height="266" rx="13" fill="url(#surface)" stroke="#4c3f30"/><rect x="21" y="20" width="1058" height="46" rx="12" fill="#101722"/><circle cx="48" cy="43" r="5" fill="#d48782" /><circle cx="69" cy="43" r="5" fill="#d9b56c" /><circle cx="90" cy="43" r="5" fill="#84c6a3" /><text x="550" y="48" font-size="14" font-weight="450" fill="#a4afbd" class="mono" text-anchor="middle">vweb.dev / studio-profile</text><rect x="907" y="84" width="153" height="30" rx="15" fill="#2b261e" stroke="#6a5333"/><text x="983.5" y="104" font-size="11" font-weight="650" fill="#efdbb6" text-anchor="middle" letter-spacing="1" class="mono">ACTIVE STUDIO</text><circle cx="926" cy="99" r="4" fill="#82d5ab" class="pulse"/><text x="49" y="114" font-size="20" font-weight="610" fill="#efdbb6" class="mono">$ whoami</text><text x="49" y="151" font-size="22" font-weight="650" fill="#f7f2e9" >VWEB.DEV — independent digital product &amp; creative studio</text><text x="49" y="191" font-size="17" font-weight="460" fill="#a4afbd" >Founded in 2014 by Zeeshan Ali Raza. Lahore, Pakistan.</text><text x="49" y="228" font-size="17" font-weight="460" fill="#a4afbd" >Human-centered design. Maintainable engineering. Practical results.</text><text x="49" y="270" font-size="17" font-weight="510" fill="#8bd9b1" class="mono">$ focus = design + technology + meaningful impact</text><rect x="650" y="252" width="9" height="20" rx="2" fill="#efdbb6"/><path d="M660 286H1017" fill="none" stroke="#c9a96e" stroke-width="1.2" class="trace" stroke-opacity=".25"/></g></svg>