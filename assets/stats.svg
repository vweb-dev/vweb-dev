<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="225" viewBox="0 0 1100 225" role="img" aria-label="Repository snapshot with restrained motion accents"><title>Repository snapshot with restrained motion accents</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="1100" height="225" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1100" height="225" rx="17" fill="#080c12"/><rect x="0" y="0" width="1100" height="225" rx="0" fill="url(#grid)"/><rect x="20" y="17" width="339" height="169" rx="12" fill="url(#surface)" stroke="#4c3f30"/><text x="45" y="95" font-size="57" font-weight="800" fill="#efdbb6" >62</text><text x="45" y="137" font-size="14" font-weight="650" fill="#a4afbd" class="mono" letter-spacing="1.1">OWNED REPOSITORIES</text><path d="M44 164H332" fill="none" stroke="#c9a96e" stroke-width="1.5" class="trace" stroke-opacity=".7"/><circle cx="335" cy="41" r="3" fill="#efdbb6" class="pulse"/><rect x="381" y="17" width="339" height="169" rx="12" fill="url(#surface)" stroke="#4c3f30"/><text x="406" y="95" font-size="57" font-weight="800" fill="#efdbb6" >2014</text><text x="406" y="137" font-size="14" font-weight="650" fill="#a4afbd" class="mono" letter-spacing="1.1">FOUNDED</text><path d="M405 164H693" fill="none" stroke="#c9a96e" stroke-width="1.5" class="trace" stroke-opacity=".7"/><circle cx="696" cy="41" r="3" fill="#efdbb6" class="pulse"/><rect x="742" y="17" width="339" height="169" rx="12" fill="url(#surface)" stroke="#4c3f30"/><text x="767" y="95" font-size="57" font-weight="800" fill="#efdbb6" >9</text><text x="767" y="137" font-size="14" font-weight="650" fill="#a4afbd" class="mono" letter-spacing="1.1">SERVICE REALMS</text><path d="M766 164H1054" fill="none" stroke="#c9a96e" stroke-width="1.5" class="trace" stroke-opacity=".7"/><circle cx="1057" cy="41" r="3" fill="#efdbb6" class="pulse"/><text x="24" y="213" font-size="12" font-weight="460" fill="#a4afbd" class="mono" letter-spacing=".7">SNAPSHOT: 21 NOV 2026   /   STATIC DATA, NOT LIVE METRICS</text></g></svg>