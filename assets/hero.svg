<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Animated VWEB.DEV digital engineering hero"><title>Animated VWEB.DEV digital engineering hero</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="1200" height="440" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1200" height="440" rx="17" fill="#080c12"/><rect x="0" y="0" width="1200" height="440" rx="0" fill="url(#grid)"/><circle cx="990" cy="215" r="300" fill="url(#glow)" /><circle cx="120" cy="425" r="215" fill="url(#glow)" /><rect x="55" y="43" width="282" height="36" rx="18" fill="#17221e" stroke="#3a5b48"/><circle cx="76" cy="62" r="5" fill="#77d2a9" class="pulse"/><text x="90" y="67" font-size="13" font-weight="660" fill="#9ee2bf" letter-spacing="1.1" class="mono">INDEPENDENT DIGITAL STUDIO</text><text x="55" y="185" font-size="107" font-weight="800" fill="url(#gold)" letter-spacing="-2">VWEB.DEV</text><text x="61" y="231" font-size="21" font-weight="550" fill="#f7f2e9" letter-spacing="2.3">STRATEGY  /  DESIGN  /  ENGINEERING</text><path d="M60 261H742" fill="none" stroke="#c9a96e" stroke-width="1.6" stroke-opacity=".4"/><path d="M60 261H742" fill="none" stroke="#efdbb6" stroke-width="2" class="trace" stroke-opacity=".65"/><text x="61" y="310" font-size="28" font-weight="620" fill="#f7f2e9" >Digital products with purpose.</text><text x="61" y="346" font-size="18" font-weight="450" fill="#a4afbd" >Web platforms  •  Automation  •  Commerce  •  AI</text><text x="62" y="402" font-size="13" font-weight="650" fill="#efdbb6" letter-spacing="1.3" class="mono">EST. 2014    /    LAHORE, PAKISTAN</text><circle cx="990" cy="216" r="158" fill="none" stroke="#c9a96e" stroke-opacity=".3" stroke-width="1.4"/><circle cx="990" cy="216" r="133" fill="none" stroke="#c9a96e" stroke-opacity=".3"/><g class="spin"><circle cx="990" cy="216" r="151" fill="none" stroke="#efdbb6" stroke-width="3" stroke-dasharray="90 850" opacity=".9"/><circle cx="990" cy="65" r="5" fill="#efdbb6" /></g><g class="rspin"><circle cx="990" cy="216" r="179" fill="none" stroke="#c9a96e" stroke-opacity=".43" stroke-width="1.5" stroke-dasharray="6 17"/><circle cx="990" cy="37" r="3" fill="#efdbb6" /></g><path d="M990 101L1100 166V266L990 331L880 266V166Z" fill="url(#surface)" stroke="url(#gold)" stroke-width="2.5"/><text x="990" y="215" font-size="43" font-weight="780" fill="#efdbb6" text-anchor="middle" letter-spacing="2">BUILD</text><text x="990" y="253" font-size="28" font-weight="570" fill="#f7f2e9" text-anchor="middle" letter-spacing="4">BETTER</text><path d="M813 127H862L880 146M1101 291L1135 317H1174" fill="none" stroke="#c9a96e" stroke-width="1.4" class="trace-slow" stroke-opacity=".6"/><text x="816" y="404" font-size="12" font-weight="540" fill="#c9a96e" class="mono" letter-spacing="1.2">MOTION / PURPOSE / PRECISION</text><circle cx="810" cy="77" r="3" fill="#efdbb6" class="pulse" style="animation-delay:0s"/><circle cx="857" cy="140" r="2" fill="#efdbb6" class="pulse" style="animation-delay:0.3s"/><circle cx="904" cy="203" r="3" fill="#efdbb6" class="pulse" style="animation-delay:0.6s"/><circle cx="951" cy="266" r="2" fill="#efdbb6" class="pulse" style="animation-delay:0.8999999999999999s"/><circle cx="998" cy="329" r="3" fill="#efdbb6" class="pulse" style="animation-delay:1.2s"/><circle cx="1045" cy="77" r="2" fill="#efdbb6" class="pulse" style="animation-delay:1.5s"/><circle cx="1092" cy="140" r="3" fill="#efdbb6" class="pulse" style="animation-delay:1.7999999999999998s"/><circle cx="1139" cy="203" r="2" fill="#efdbb6" class="pulse" style="animation-delay:2.1s"/><circle cx="816" cy="266" r="3" fill="#efdbb6" class="pulse" style="animation-delay:2.4s"/><path d="M20 20H1180" fill="none" stroke="#c9a96e" stroke-width="1.2" class="trace" stroke-opacity=".4"/></g></svg>