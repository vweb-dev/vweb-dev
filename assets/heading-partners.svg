<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="104" viewBox="0 0 1100 104" role="img" aria-label="Partners and platforms section heading"><title>Partners and platforms section heading</title><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2938"/><stop offset="1" stop-color="#0b1119"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e3c2"/><stop offset=".5" stop-color="#c9a96e"/><stop offset="1" stop-color="#8b6c41"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#c9a96e" stroke-opacity=".065" fill="none"/></pattern><clipPath id="frame"><rect width="1100" height="104" rx="18"/></clipPath><style>text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}
.flow{stroke-dasharray:9 20;animation:flow 9s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}
.float{animation:float 8s ease-in-out infinite}.shine{animation:shine 7s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-232}}@keyframes pulse{0%,100%{opacity:.32}50%{opacity:.94}}
