<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="237" viewBox="0 0 1100 237" role="img" aria-label="VWEB.DEV animated contact invitation"><title>VWEB.DEV animated contact invitation</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="1100" height="237" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="1100" height="237" rx="17" fill="#080c12"/><rect x="0" y="0" width="1100" height="237" rx="0" fill="url(#grid)"/><circle cx="972" cy="122" r="215" fill="url(#glow)" /><rect x="1" y="1" width="1098" height="235" rx="17" fill="none" stroke="#4c3f30"/><text x="30" y="68" font-size="18" font-weight="720" fill="#efdbb6" letter-spacing="1.4">HAVE A PROJECT IN MIND?</text><text x="29" y="128" font-size="40" font-weight="800" fill="#f7f2e9" >LET'S BUILD SOMETHING USEFUL.</text><text x="31" y="170" font-size="18" font-weight="450" fill="#a4afbd" >Practical strategy, product engineering and long-term value.</text><text x="31" y="207" font-size="17" font-weight="550" fill="#efdbb6" >vweb.dev     •     info@vweb.dev     •     +92 321 4433 994</text><circle cx="981" cy="118" r="89" fill="none" stroke="#c9a96e" stroke-width="1.3" stroke-opacity=".5" class="pulse"/><g class="float"><path d="M926 148L954 96L992 120L1022 71" fill="none" stroke="#c9a96e" stroke-width="2" class="trace"/><circle cx="954" cy="96" r="5" fill="#efdbb6" /><circle cx="992" cy="120" r="5" fill="#efdbb6" /></g><path d="M30 225H695" fill="none" stroke="#c9a96e" stroke-width="1.5" class="trace-slow" stroke-opacity=".43"/></g></svg>