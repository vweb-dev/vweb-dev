<svg xmlns="http://www.w3.org/2000/svg" width="538" height="253" viewBox="0 0 538 253" role="img" aria-label="PCMEA CONNECT motion-enhanced repository card"><title>PCMEA CONNECT motion-enhanced repository card</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e5c1"/><stop offset=".55" stop-color="#c9a96e"/><stop offset="1" stop-color="#856842"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182330"/><stop offset="1" stop-color="#0c121b"/></linearGradient><radialGradient id="glow"><stop stop-color="#c9a96e" stop-opacity=".17"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c9a96e" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="538" height="253" rx="17"/></clipPath><style>
text{font-family:Inter,'Segoe UI',Arial,Helvetica,sans-serif}
.mono{font-family:Consolas,Menlo,monospace}
.spin{transform-origin:990px 216px;animation:sp 31s linear infinite}
.rspin{transform-origin:990px 216px;animation:sp 43s linear infinite reverse}
.trace{stroke-dasharray:9 21;animation:tr 8s linear infinite}
.trace-slow{stroke-dasharray:4 13;animation:tr 14s linear infinite}
.pulse{animation:pu 3.4s ease-in-out infinite}
.float{animation:fl 7.5s ease-in-out infinite}
.scan{animation:sc 5.7s ease-in-out infinite}
.glint{animation:pu 9s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tr{to{stroke-dashoffset:-240}}
@keyframes pu{0%,100%{opacity:.28}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sc{0%,100%{transform:translateX(0);opacity:.1}70%{transform:translateX(154px);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin,.rspin,.trace,.trace-slow,.pulse,.float,.scan,.glint{animation:none!important}}
</style></defs><g clip-path="url(#clip)"><rect x="0" y="0" width="538" height="253" rx="16" fill="#080c12"/><rect x="1" y="1" width="536" height="251" rx="15" fill="url(#surface)" stroke="#56452f"/><rect x="17" y="16" width="144" height="30" rx="15" fill="#2b261e" stroke="#6a5333"/><text x="89" y="36" font-size="11" font-weight="650" fill="#efdbb6" text-anchor="middle" letter-spacing="1" class="mono">APPLICATION</text><text x="501" y="40" font-size="23" font-weight="750" fill="#efdbb6" class="mono" text-anchor="end">03</text><text x="23" y="104" font-size="28" font-weight="780" fill="#f7f2e9" >PCMEA CONNECT</text><text x="23" y="136" font-size="17" font-weight="580" fill="#efdbb6" >Association web platform</text><text x="23" y="164" font-size="14" font-weight="450" fill="#a4afbd" >Next.js and TypeScript project</text><rect x="414" y="70" width="99" height="103" rx="12" fill="#111923" stroke="#4c3f30"/><circle cx="464" cy="93" r="5" fill="#efdbb6" class="pulse"/><circle cx="441" cy="121" r="5" fill="#efdbb6" class="pulse"/><circle cx="489" cy="121" r="5" fill="#efdbb6" class="pulse"/><circle cx="464" cy="153" r="5" fill="#efdbb6" class="pulse"/><path d="M464 93L441 121L464 153L489 121L464 93M441 121H489" fill="none" stroke="#c9a96e" stroke-width="1.2" class="trace"/><path d="M23 198H515" fill="none" stroke="#c9a96e" stroke-width="1.4" class="trace" stroke-opacity=".46"/><text x="23" y="228" font-size="14" font-weight="740" fill="#efdbb6" class="mono" letter-spacing="1.2">VIEW REPOSITORY</text><text x="503" y="230" font-size="27" font-weight="700" fill="#efdbb6" text-anchor="end">↗</text></g></svg>